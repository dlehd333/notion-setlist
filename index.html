<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>찬양 리스트 - 중복/오타 검출 & 정렬</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>🎵 찬양 데이터 관리 및 정제</h1>

  <!-- 1. 중복 & 오타 의심 곡 검출 섹션 -->
  <div class="warning-section">
    <h2 class="warning-title">⚠️ 중복 & 오타 의심곡 목록 (<span id="duplicate-group-count">0</span>건)</h2>
    <p style="font-size: 0.9em; color: #666; margin-bottom: 12px;">
      * 띄어쓰기/괄호/Key 표기 차이(중복) 또는 오타/유사 곡명으로 추정되는 목록입니다. 노션 DB 정제 시 참고해 주세요.
    </p>
    <table>
      <thead>
        <tr>
          <th>구분</th>
          <th>기준 곡명 / 의심 그룹</th>
          <th>감지된 입력값 목록 (노션 데이터)</th>
          <th>총 합계 횟수</th>
        </tr>
      </thead>
      <tbody id="duplicate-list"></tbody>
    </table>
  </div>

  <!-- 2. 전체 곡 목록 및 정렬 토글 -->
  <div class="list-header">
    <h2>3. 전체 정렬된 곡 목록 (총 <span id="unique-count">0</span>곡)</h2>
    <div class="btn-group">
      <button id="btn-sort-count" class="sort-btn active" onclick="setSortMode('count')">🔥 횟수많은순 → 빠른날짜순</button>
      <button id="btn-sort-date" class="sort-btn" onclick="setSortMode('date')">📅 빠른날짜순 → 횟수많은순</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>찬양 곡명</th>
        <th>누적 횟수</th>
        <th>최신 연주일</th>
      </tr>
    </thead>
    <tbody id="aggregated-list"></tbody>
  </table>

  <script src="script.js"></script>
</body>
</html>
